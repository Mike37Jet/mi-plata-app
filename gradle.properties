# --- JVM del daemon de Gradle ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Rendimiento de build ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- R8 en modo completo para release ---
android.enableR8.fullMode=true

# --- Métricas del compilador de Compose (ver docs/02, sección Rendimiento) ---
# Se activan a demanda:
#   ./gradlew assembleRelease -Pmiplata.enableComposeCompilerMetrics=true
miplata.enableComposeCompilerMetrics=false
miplata.enableComposeCompilerReports=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
