name: PR

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecucion anterior: no tiene sentido
# gastar minutos verificando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build y verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Solo se escribe cache desde main; los PR lo leen. Evita que un PR
          # envenene el cache compartido.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # GitHub Actions define CI=true, y de eso dependen allWarningsAsErrors y
      # lint.warningsAsErrors (ver build-logic). Aqui los warnings SI rompen.

      - name: Formato (spotless)
        run: ./gradlew spotlessCheck

      - name: Analisis estatico (detekt)
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest :core:domain:test

      - name: Build
        run: ./gradlew assembleDebug

      - name: Subir reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-verificacion
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
