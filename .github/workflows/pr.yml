name: PR

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecucion anterior: no tiene sentido
# gastar minutos verificando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build y verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Se queda en v5 a proposito. La v6 extrajo el cacheo a una libreria
      # separada que ya no es open-source, y de paso elimino el soporte de
      # configuration-cache. La v5 ya corre en node24, que es lo unico que
      # hacia falta aqui.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Solo se escribe cache desde main; los PR lo leen. Evita que un PR
          # envenene el cache compartido.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # GitHub Actions define CI=true, y de eso dependen allWarningsAsErrors y
      # lint.warningsAsErrors (ver build-logic). Aqui los warnings SI rompen.

      - name: Formato (spotless)
        run: ./gradlew spotlessCheck

      - name: Analisis estatico (detekt)
        run: ./gradlew detekt

      # build-logic es un build incluido y no lo alcanza el detekt de arriba.
      - name: Analisis estatico (build-logic)
        run: ./gradlew -p build-logic detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest testsDeJvm

      # La cobertura se exige solo en :core:domain, que es donde vive la logica
      # financiera. Ver el comentario en core/domain/build.gradle.kts.
      - name: Cobertura del dominio
        run: ./gradlew :core:domain:koverVerify :core:domain:koverHtmlReport

      - name: Build
        run: ./gradlew assembleDebug

      # Los tests instrumentados no se EJECUTAN en CI -necesitan un emulador,
      # que es la parte mas fragil de cualquier CI de Android- pero si se
      # compilan, para que no se pudran en silencio mientras el codigo avanza.
      - name: Compilar los tests instrumentados
        run: ./gradlew assembleDebugAndroidTest

      - name: Subir reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-verificacion
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/kover/
            **/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
